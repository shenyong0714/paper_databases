name: Daily arXiv Update

on:
  schedule:
    # cron is in UTC. Same three times as the arxiv-digest email repo. GitHub often runs
    # scheduled jobs late or drops one, so three a day make sure one lands each morning.
    # Repeats are harmless: papers already in the database are skipped.
    - cron: '30 5 * * *'    # 05:30 UTC
    - cron: '30 13 * * *'   # 13:30 UTC
    - cron: '30 23 * * *'   # 23:30 UTC
  workflow_dispatch:  # Allow manual runs
    inputs:
      extract_only:
        description: 'Skip fetching and pruning; only fill dates and extract figures'
        type: boolean
        default: false

permissions:
  contents: write  # lets the optional snapshot step push

concurrency:
  group: extraction
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run arXiv fetcher
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        cd scripts
        python run_daily.py ${{ inputs.extract_only && '--extract-only' || '' }}

    - name: Commit data snapshot (optional)
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/*.json || true
        git diff --quiet && git diff --staged --quiet || git commit -m "Daily update: $(date -u +%Y-%m-%d)" || true
        git push || true
