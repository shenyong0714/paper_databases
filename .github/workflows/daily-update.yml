name: Daily arXiv Update

on:
  schedule:
    # cron is in UTC. arXiv announces new papers ~20:00 US Eastern the previous evening.
    # Off-the-hour minutes avoid GitHub's top-of-hour congestion, where scheduled runs get dropped.
    # Main run: 10:23 UTC Mon-Fri (05:23 EST / 06:23 EDT)
    - cron: '23 10 * * 1-5'
    # Backup run: 17:05 UTC Mon-Fri (12:05 EST / 13:05 EDT). Safe to repeat: existing papers are skipped.
    - cron: '5 17 * * 1-5'
  workflow_dispatch:  # Allow manual runs

permissions:
  contents: write  # lets the optional snapshot step push

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run arXiv fetcher
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      run: |
        cd scripts
        python run_daily.py

    - name: Commit data snapshot (optional)
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add data/*.json || true
        git diff --quiet && git diff --staged --quiet || git commit -m "Daily update: $(date -u +%Y-%m-%d)" || true
        git push || true
