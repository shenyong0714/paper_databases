name: Backfill Specific Date

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD, UTC)'
        required: true
        default: '2026-11-10'
      end_date:
        description: 'End date (YYYY-MM-DD, UTC)'
        required: true
        default: '2026-11-11'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run date-specific backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cd scripts
          python backfill_date.py "${{ github.event.inputs.start_date }}" "${{ github.event.inputs.end_date }}"
