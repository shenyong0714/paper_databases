<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Research Desk</title>
<meta name="description" content="Personal arXiv digest for condensed matter physics">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Archivo:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#fafbfc; --surface:#fff; --raise:#f3f5f8;
  --ink:#151a21; --muted:#5f6a79; --faint:#8d97a5; --line:#e2e7ed;
  --accent:#0f6d8a; --accent-soft:#e2f1f6; --gold:#8c6206; --gold-soft:#f8eed8;
  --good:#1d6b45; --bad:#a3332a;
  --f-display:"Newsreader",Georgia,serif; --f-ui:"Archivo",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1217; --surface:#151b22; --raise:#1b232c;
  --ink:#e4eaf1; --muted:#8a95a5; --faint:#69737f; --line:#242d38;
  --accent:#52c4e6; --accent-soft:#12303c; --gold:#d9a53c; --gold-soft:#332712;
  --good:#5fc08c; --bad:#e78077;
}}
:root[data-theme="dark"]{
  --paper:#0e1217; --surface:#151b22; --raise:#1b232c;
  --ink:#e4eaf1; --muted:#8a95a5; --faint:#69737f; --line:#242d38;
  --accent:#52c4e6; --accent-soft:#12303c; --gold:#d9a53c; --gold-soft:#332712;
  --good:#5fc08c; --bad:#e78077;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0;font:14px var(--f-ui);background:var(--paper);color:var(--ink)}
*{box-sizing:border-box}
h1,h2,h3{margin:0;text-wrap:balance}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--accent)}
img{max-width:100%}
[hidden]:not([hidden=until-found i]){display:none!important}

.shell{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:0 32px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding-block:12px;margin-inline:-16px;padding-inline:16px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:500;font-size:21px;letter-spacing:-.01em}
.brand .sub{font-family:var(--f-mono);font-size:11px;color:var(--faint);letter-spacing:.04em}
.tabs{display:flex;gap:2px;margin-top:10px}
.tab{padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:11px;opacity:.75;margin-left:5px}

.cols{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:28px;margin-top:20px;align-items:start}
@media(max-width:860px){.cols{grid-template-columns:1fr;gap:0}
  .pane.detail{display:none} .pane.detail.on{display:block;margin-top:16px}
  .pane.list.hide{display:none}}

.plist{display:flex;flex-direction:column;gap:1px;background:var(--line);
       border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pitem{background:var(--surface);padding:11px 13px;display:grid;
       grid-template-columns:34px 1fr;gap:11px;text-align:left;width:100%;align-items:start}
.pitem:hover{background:var(--raise)}
.pitem[aria-current="true"]{background:var(--accent-soft)}
.score{font-family:var(--f-mono);font-size:15px;font-weight:500;color:var(--accent);
       text-align:right;padding-top:1px;font-variant-numeric:tabular-nums}
.pitem h3{font-family:var(--f-display);font-size:15px;font-weight:500;line-height:1.3}
.meta{font-family:var(--f-mono);font-size:10.5px;color:var(--faint);margin-top:4px;
      display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kw{display:inline-block;background:var(--raise);color:var(--muted);border-radius:3px;
    padding:1px 5px;font-size:10px;font-family:var(--f-mono)}
.dot{width:5px;height:5px;border-radius:50%;background:var(--gold);flex:none}

.pane.detail{background:var(--surface);border:1px solid var(--line);border-radius:8px;
             padding:22px 24px;min-height:200px}
@media(max-width:600px){.pane.detail{padding:16px}}
.back{display:none;font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-bottom:12px}
@media(max-width:860px){.back{display:block}}
.dhead h2{font-family:var(--f-display);font-size:23px;font-weight:500;line-height:1.24}
.authors{color:var(--muted);font-size:13px;margin-top:7px}
.idline{font-family:var(--f-mono);font-size:11px;color:var(--faint);margin-top:9px;
        display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.abstract{margin-top:16px;font-family:var(--f-display);font-size:15.5px;line-height:1.62;
          max-width:66ch;color:var(--ink)}
.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:6px;padding:6px 13px;font-size:13px;
     font-weight:500;background:var(--surface)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
:root[data-theme="dark"] .btn.primary{color:#07161c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#07161c}}
.btn.on{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.btn[disabled]{opacity:.45;cursor:default}

.sec{margin-top:26px;border-top:1px solid var(--line);padding-top:18px}
.sec > h3{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.09em;
          text-transform:uppercase;color:var(--faint);font-weight:500;margin-bottom:12px}
.figs{display:flex;flex-direction:column;gap:22px}
figure{margin:0}
figure img{width:100%;max-width:100%;border:1px solid var(--line);border-radius:5px;
           background:#fff;display:block}
figcaption{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5;max-width:74ch}
figcaption b{font-family:var(--f-mono);font-size:11px;color:var(--accent);font-weight:500}

.askrow{display:flex;gap:8px}
.askrow input{flex:1;min-width:0;background:var(--paper);border:1px solid var(--line);
  border-radius:6px;padding:9px 11px;font:inherit;font-size:13.5px;color:var(--ink)}
.askrow input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.empty{color:var(--muted);font-size:13.5px;padding:28px 0;max-width:60ch}
.note{font-size:12px;color:var(--faint);margin-top:8px;line-height:1.5}
.zoom{position:fixed;inset:0;background:rgba(6,10,14,.9);z-index:50;display:flex;
      align-items:center;justify-content:center;padding:20px}
.zoom img{max-width:100%;max-height:92vh;border-radius:5px;background:#fff}
.toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--ink);color:var(--paper);padding:9px 15px;border-radius:6px;
  font-size:13px;max-width:min(560px,92vw);box-shadow:0 4px 18px rgba(0,0,0,.22)}
.toast.bad{background:var(--bad);color:#fff}
.claude-link{margin-top:14px}
.claude-link a{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;
  background:var(--accent);color:#fff;border-radius:6px;text-decoration:none;font-size:13px}
.claude-link a:hover{opacity:.9}
</style>
</head>
<body>

<div class="shell">
  <header class="top">
    <div class="brand">
      <h1>Research Desk</h1>
      <span class="sub">cond-mat · supr-con / str-el / mes-hall</span>
      <span class="sub" id="runstat"></span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-week" aria-selected="true">This week <span class="n" id="n-week"></span></button>
      <button class="tab" role="tab" id="tab-arch" aria-selected="false">Archive <span class="n" id="n-arch"></span></button>
    </div>
  </header>

  <div class="cols">
    <div class="pane list" id="pane-list"><div class="plist" id="plist"></div>
      <p class="note" id="listnote"></p>
    </div>
    <div class="pane detail" id="pane-detail"></div>
  </div>
</div>

<script type="module">
// Supabase connection (replace with your project details)
const SUPABASE_URL = 'https://aleirqepbpkelpujixrb.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFsZWlycWVwYnBrZWxwdWppeHJiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4ODY1NjUsImV4cCI6MjExMDQ2MjU2NX0.XZVVIvRo7CeZhnzTSXgPLfV28GBVrI1B5jwByEym6Zg';

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const state = {tab:"week", papers:[], sel:null};

const hasFigs = p => Array.isArray(p.figures) && p.figures.length > 0;
const hasText = p => +p.text_parts > 0;
const isReady = p => hasText(p);
const inArchive = p => p.state !== "week";
const pid = p => p.arxiv_id;
const posted = p => {
  const m = /^(\d{2})(\d{2})\.(\d+)$/.exec(String(p.arxiv_id||""));
  return m ? (+m[1])*1e9 + (+m[2])*1e7 + (+m[3]) : -1;
};

function render(){
  $("#n-week").textContent = state.papers.filter(p=>!inArchive(p)).length || "";
  $("#n-arch").textContent = state.papers.filter(inArchive).length || "";
  for(const t of ["week","arch"])
    $("#tab-"+t).setAttribute("aria-selected", state.tab===t);

  const rows = state.papers.filter(p => state.tab==="week" ? !inArchive(p) : inArchive(p))
    .sort(state.tab==="week"
      ? (a,b)=> (posted(b)-posted(a)) || (b.score-a.score) || a.title.localeCompare(b.title)
      : (a,b)=> (b.score-a.score) || a.title.localeCompare(b.title));

  const list = $("#plist");
  list.innerHTML = rows.length ? "" :
    `<div style="background:var(--surface);padding:22px 14px" class="empty">${
      state.tab==="week" ? "No papers in this week's queue yet."
      : "Nothing archived yet. Open a paper from this week and press Save."}</div>`;

  for(const p of rows){
    const b=document.createElement("button");
    b.className="pitem"; b.setAttribute("aria-current", state.sel===pid(p));
    b.innerHTML = `<span class="score">${esc(String(p.score))}</span><span>
      <h3>${esc(p.title)}</h3>
      <span class="meta">
        ${isReady(p)?`<span class="dot" title="${hasFigs(p)?"figures and text ready":"text ready (no figures)"}"></span>`:""}
        ${!isReady(p)?'<span style="color:var(--gold)">queued</span>':""}
        <span>${esc(p.cat||"")}</span>
        <span>${esc(pid(p))}</span>
      </span>
      <span class="meta">${(p.matched||[]).slice(0,4).map(k=>`<span class="kw">${esc(k)}</span>`).join("")}</span>
    </span>`;
    b.onclick = ()=>{ state.sel=pid(p); renderDetail(); render();
      if(innerWidth<=860){ $("#pane-list").classList.add("hide"); $("#pane-detail").classList.add("on"); } };
    list.appendChild(b);
  }
  $("#listnote").textContent = rows.length ? `${rows.length} paper${rows.length>1?"s":""}` : "";
}

function figHTML(p){
  if(!hasFigs(p)){
    if(p.extract_error) return `<p class="empty">Could not extract this PDF: ${esc(p.extract_error)}</p>`;
    if(hasText(p)) return `<p class="empty">No figures in this PDF.</p>`;
    return `<p class="empty">Queued. The daily update will extract figures.</p>`;
  }
  return `<div class="figs">${p.figures.map(x=>`<figure>
    <img src="${esc(x.url)}" alt="Figure ${x.n}" loading="lazy" data-zoom="${esc(x.url)}">
    <figcaption><b>FIG ${x.n} · p${x.page}</b> ${esc(x.caption.replace(/^\s*(FIG\.?|Figure|Fig\.)\s*\.?\s*\d+[.:]?\s*/i,""))}</figcaption>
  </figure>`).join("")}</div>`;
}

function renderDetail(){
  const p = state.papers.find(x=>pid(x)===state.sel);
  const d = $("#pane-detail");
  if(!p){ d.innerHTML=`<p class="empty">Select a paper.</p>`; return; }
  const saved = inArchive(p);
  d.innerHTML = `
    <button class="back" id="back">&larr; back to list</button>
    <div class="dhead">
      <h2>${esc(p.title)}</h2>
      <div class="authors">${esc((p.authors||[]).join(", "))}</div>
      <div class="idline">
        <a href="https://arxiv.org/abs/${esc(p.arxiv_id)}" target="_blank" rel="noopener">arXiv:${esc(p.arxiv_id)}</a>
        <span>${esc(p.cat||"")}</span><span>score ${p.score}</span>
        ${(p.matched||[]).map(k=>`<span class="kw">${esc(k)}</span>`).join(" ")}
      </div>
    </div>
    <p class="abstract">${esc(p.abstract)}</p>
    <div class="actions">
      <button class="btn ${saved?"on":"primary"}" id="save">${saved?"★ Saved":"Save to archive"}</button>
      <a class="btn" href="https://arxiv.org/pdf/${esc(p.arxiv_id)}" target="_blank" rel="noopener">PDF</a>
    </div>
    <div class="sec"><h3>Figures</h3>${figHTML(p)}</div>
    <div class="sec">
      <h3>Ask this paper</h3>
      ${isReady(p) ? `
        <p class="empty" style="padding:6px 0">Copies this paper (abstract, figure captions and full text) and opens the July project in Claude.
        Start a new chat there and paste. Every paper's chat lives in July, so Claude can connect them over time.</p>
        <div class="claude-link">
          <a href="${JULY_URL}" target="_blank" rel="noopener" id="ask">Copy &amp; open in July &rarr;</a>
        </div>
        <p class="note" id="asknote">${textCache.has(p.arxiv_id) ? "Full text ready to copy." : "Loading full text…"}</p>` :
        `<p class="empty">Available once the paper's text has been pulled in.</p>`}
    </div>`;
  $("#back")?.addEventListener("click",()=>{ $("#pane-list").classList.remove("hide");
    $("#pane-detail").classList.remove("on"); });
  $("#save")?.addEventListener("click",()=>toggleSave(p));
  $("#ask")?.addEventListener("click",()=>askInJuly(p));
  if(isReady(p)) loadText(p);
  d.querySelectorAll("[data-zoom]").forEach(img=>img.addEventListener("click",()=>{
    const z=document.createElement("div"); z.className="zoom";
    z.innerHTML=`<img src="${img.dataset.zoom}" alt="">`;
    z.onclick=()=>z.remove(); document.body.appendChild(z);
  }));
}

// ---------- Ask in Claude: copy the paper, open the July project ----------
const JULY_URL = 'https://claude.ai/project/01a0b155-d37a-74ce-8ed7-a9500b47a4c2';
const textCache = new Map();   // arxiv_id -> full text (prefetched so the click can copy at once)

async function loadText(p){
  if(textCache.has(p.arxiv_id)) return;
  const { data, error } = await supabase.from('fulltext').select('part,text')
    .eq('arxiv_id', p.arxiv_id).order('part');
  if(error){ console.warn('fulltext', error); return; }
  textCache.set(p.arxiv_id, (data||[]).map(r=>r.text).join(''));
  const n = document.getElementById('asknote');
  if(n && state.sel === p.arxiv_id) n.textContent = 'Full text ready to copy.';
}

function paperPrompt(p){
  const caps = (p.figures||[]).map(x=>`- Fig. ${x.n} (p${x.page}): ${x.caption}`).join('\n');
  const full = textCache.get(p.arxiv_id);
  return [
    `New paper for my Paper Desk. Read it, keep it in mind alongside the other papers in this project, then answer my questions.`,
    ``,
    `Title: ${p.title}`,
    `arXiv: https://arxiv.org/abs/${p.arxiv_id}  (${p.cat||''})`,
    `Authors: ${(p.authors||[]).join(', ')}`,
    `Matched keywords: ${(p.matched||[]).join(', ')}`,
    ``,
    `Abstract:`, p.abstract || '',
    caps ? `\nFigure captions:\n${caps}` : '',
    full ? `\n===== FULL TEXT =====\n${full}` : `\n(Full text not loaded; read the arXiv link above.)`,
  ].join('\n');
}

function askInJuly(p){
  // no await before the copy: the browser only allows clipboard writes during the click itself
  const txt = paperPrompt(p);
  navigator.clipboard.writeText(txt).then(
    ()=>note(textCache.has(p.arxiv_id) ? 'Copied with full text. Start a new chat in July and paste.'
                                        : 'Copied (abstract only). Start a new chat in July and paste.'),
    e=>note(`Could not copy: ${e.message}`, true));
  // the link itself opens July in a new tab
}

async function toggleSave(p){
  const was = p.state;
  const next = was === "week" ? "saved" : "week";
  p.state = next; render(); renderDetail();

  const patch = {state: next};
  if(next !== "week") patch.saved_at = new Date().toISOString();

  try{
    const { error } = await supabase.from('papers').update(patch).eq('arxiv_id', p.arxiv_id);
    if(error) throw error;
    note(next === "week" ? "Removed from the archive." : "Saved to the archive.");
  }catch(e){
    p.state = was; render(); renderDetail();
    note(`Could not save: ${e.message}`, true);
  }
}

let noteTimer;
function note(msg, bad){
  let el = document.getElementById("toast");
  if(!el){ el = document.createElement("div"); el.id="toast"; document.body.appendChild(el); }
  el.textContent = msg;
  el.className = bad ? "toast bad" : "toast";
  el.hidden = false;
  clearTimeout(noteTimer);
  noteTimer = setTimeout(()=>{ el.hidden = true; }, bad ? 9000 : 3500);
}

$("#tab-week").onclick=()=>{state.tab="week";render();};
$("#tab-arch").onclick=()=>{state.tab="arch";render();};

(async function boot(){
  render();

  try{
    // Load runs
    const { data: runs } = await supabase.from('runs').select('*').order('date', {ascending: false}).limit(1);
    const r = runs?.[0];
    if(r){
      const age = Math.floor((Date.now()-Date.parse(r.at))/36e5);
      const when = age<1 ? "just now" : age<24 ? `${age}h ago` : `${Math.floor(age/24)}d ago`;
      const nFail = Array.isArray(r.feeds_failed) ? r.feeds_failed.length : 0;
      const bad = (r.errors||[]).length + nFail;
      $("#runstat").innerHTML = `· updated ${when} · +${r.added??0} new` +
        (r.extracted ? ` · ${r.extracted} extracted` : "") +
        (bad ? ` · <span style="color:var(--bad)">${(r.errors||[])[0]||"a feed failed"}</span>` : "");
    }

    // Load papers
    const { data: papers } = await supabase.from('papers').select('*');
    state.papers = papers || [];

    if(!state.sel && state.papers.length){
      const wk=state.papers.filter(p=>!inArchive(p)).sort((a,b)=>posted(b)-posted(a));
      state.sel=(wk[0]||state.papers[0]).arxiv_id;
    }

    render(); renderDetail();

    // Subscribe to realtime updates
    supabase.channel('papers-changes')
      .on('postgres_changes', {event: '*', schema: 'public', table: 'papers'}, payload => {
        console.log('Paper updated:', payload);
        // Reload papers
        supabase.from('papers').select('*').then(({data}) => {
          state.papers = data || [];
          render(); renderDetail();
        });
      })
      .subscribe();

  }catch(e){
    $("#listnote").textContent = "Could not load papers: " + e.message;
    console.error(e);
  }
})();
</script>

</body>
</html>
